<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <link rel="icon" href="https://q2.qlogo.cn/headimg_dl?dst_uin=2726730791&spec=5">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xLog 网盘工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px; /* 增加宽度以适应更多内容 */
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .content {
            padding: 40px;
        }

        .upload-section {
            margin-bottom: 40px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 20px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 15px;
        }

        .file-input {
            display: none;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-success {
            background: #28a745;
        }

        .progress {
            width: 100%;
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }

        .url-display {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9em; /* 调小字体 */
        }

        .copy-btn {
            background: #28a745;
            font-size: 0.9rem;
            padding: 8px 16px;
        }

        .storage-section {
            border-top: 2px solid #e9ecef;
            padding-top: 40px;
            margin-top: 40px;
        }

        .section-title {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); /* 调整最小宽度 */
            gap: 20px;
            margin-top: 20px;
        }

        .file-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .file-card:hover {
            transform: translateY(-5px);
        }

        .file-preview {
            width: 100%;
            height: 150px;
            object-fit: cover; /* 保持宽高比，裁剪填充 */
            background: #f0f0f0; /* 为非图片文件提供背景 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .file-info {
            padding: 15px;
            flex-grow: 1;
        }

        .file-cid {
            font-family: monospace;
            font-size: 0.8rem;
            color: #666;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .file-actions {
            display: flex;
            gap: 5px;
            flex-wrap: wrap; /* 允许按钮换行 */
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .import-export {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .stats {
            background: #f8f9ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .stats-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stats-label {
            color: #666;
            margin-top: 5px;
        }

        .file-name {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .file-meta {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 10px;
        }

        .file-size {
            display: inline-block;
            margin-right: 10px;
        }

        .file-type {
            display: inline-block;
            background: #e9ecef;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
        }

        .file-upload-time {
            font-size: 0.8rem;
            color: #999;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 15px;
            }

            .content {
                padding: 20px;
            }

            .header {
                padding: 20px;
            }

            .header h1 {
                font-size: 2rem;
            }

            .file-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); /* 调整移动端最小宽度 */
                gap: 15px;
            }

            .import-export {
                flex-direction: column;
            }

            .file-preview {
                height: 120px; /* 调整移动端预览高度 */
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💾 xLog 网盘工具</h1>
            <p>上传文件到 IPFS，管理您的文件资源</p>
            <div style="margin-top: 15px;">
                <a href="https://github.com/afoim/ipfs-html" target="_blank"
                   style="display: inline-block; background: rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 0.9rem; transition: all 0.3s ease;"
                   onmouseover="this.style.background='rgba(255,255,255,0.3)'"
                   onmouseout="this.style.background='rgba(255,255,255,0.2)'">
                    <span style="margin-right: 5px;">⭐</span>开源项目 GitHub
                </a>
            </div>
        </div>

        <div class="content">
            <!-- 上传区域 -->
            <div class="upload-section">
                <h2 class="section-title">
                    <span>🚀</span>
                    上传文件
                </h2>

                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">📁</div>
                    <div class="upload-text">点击选择文件或拖拽文件到此处</div>
                    <div style="color: #999; font-size: 0.9rem;">支持任意格式文件</div>
                    <input type="file" id="fileInput" class="file-input" multiple> <!-- 允许多选 -->
                </div>

                <div class="progress" id="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="result" id="result">
                    <div id="resultContent"></div>
                </div>
            </div>

            <!-- 本地存储管理 -->
            <div class="storage-section">
                <h2 class="section-title">
                    <span>📂</span>
                    本地存储管理
                </h2>

                <div class="stats">
                    <div class="stats-number" id="fileCount">0</div>
                    <div class="stats-label">已保存文件</div>
                </div>

                <div class="import-export">
                    <button class="btn" onclick="exportData()">📤 导出数据</button>
                    <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
                    <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空数据</button>
                    <input type="file" id="importFile" style="display: none" accept=".json" onchange="importData(event)">
                </div>

                <div class="file-grid" id="fileGrid">
                    <!-- 文件卡片将在这里动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 页面底部 -->
    <footer style="text-align: center; padding: 20px; color: #666; background: #f8f9fa; margin-top: 20px;">
        <div style="margin-bottom: 10px;">
            <span style="margin-right: 10px;">💖 开源项目</span>
            <a href="https://github.com/afoim/ipfs-html" target="_blank" style="color: #667eea; text-decoration: none; font-weight: 500;">
                <span style="margin-right: 5px;">⭐</span>GitHub
            </a>
        </div>
        <div style="font-size: 0.9rem; color: #999;">
            基于 IPFS 的网盘工具 | 开源免费使用
        </div>
    </footer>

    <script>
        // 本地存储键名
        const STORAGE_KEY = 'xlog_files'; // 改为 files

        // 获取DOM元素
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const result = document.getElementById('result');
        const resultContent = document.getElementById('resultContent');
        const fileGrid = document.getElementById('fileGrid'); // 改为 fileGrid
        const fileCount = document.getElementById('fileCount'); // 改为 fileCount

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadFiles(); // 改为 loadFiles
            updateFileCount(); // 改为 updateFileCount
        });

        // 上传区域点击事件
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // 文件选择事件
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                for (let i = 0; i < e.target.files.length; i++) { // 遍历多选文件
                    uploadFile(e.target.files[i]); // 改为 uploadFile
                }
            }
        });

        // 拖拽事件
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) { // 不限制类型，允许任意文件
                for (let i = 0; i < files.length; i++) {
                    uploadFile(files[i]); // 改为 uploadFile
                }
            }
        });

        // 上传文件函数
        async function uploadFile(file) { // 改为 uploadFile
            // 检查文件大小（限制为100MB）
            if (file.size > 100 * 1024 * 1024) {
                showResult(`文件 "${file.name}" 太大，请选择小于100MB的文件`, 'error');
                return;
            }

            // 显示进度条
            progress.style.display = 'block';
            progressBar.style.width = '0%';
            result.style.display = 'none';

            // 创建FormData
            const formData = new FormData();
            formData.append('file', file);

            try {
                // 模拟进度
                let progressValue = 0;
                const progressInterval = setInterval(() => {
                    progressValue += Math.random() * 30;
                    if (progressValue > 90) progressValue = 90;
                    progressBar.style.width = progressValue + '%';
                }, 100);

                // 发送请求
                const response = await fetch('https://ipfs-relay.crossbell.io/upload', { // 注意：API 本身可能只处理单个文件
                    method: 'POST',
                    body: formData
                });

                clearInterval(progressInterval);
                progressBar.style.width = '100%';

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.status === 'ok') {
                    // 保存到本地存储
                    saveFileToStorage({ // 改为 saveFileToStorage
                        cid: data.cid,
                        url: data.url,
                        web2url: data.web2url,
                        fileSize: data.fileSize,
                        fileName: file.name,
                        fileType: file.type, // 添加文件类型
                        uploadTime: new Date().toISOString()
                    });

                    // 显示成功结果
                    showResult(`
                        <div><strong>上传成功！</strong></div>
                        <div style="margin: 15px 0;">
                            <div style="margin-bottom: 10px;"><strong>文件名:</strong> ${file.name}</div>
                            <div style="margin-bottom: 10px;"><strong>CID:</strong></div>
                            <div class="url-display">${data.cid}</div>
                            <button class="btn copy-btn btn-small" onclick="copyToClipboard('${data.cid}')">复制 CID</button>
                        </div>
                        <div style="margin: 15px 0;">
                            <div style="margin-bottom: 10px;"><strong>访问链接:</strong></div>
                            <div class="url-display">${data.web2url}</div>
                            <button class="btn copy-btn btn-small" onclick="copyToClipboard('${data.web2url}')">复制链接</button>
                            <button class="btn btn-secondary btn-small" onclick="window.open('${data.web2url}', '_blank')">下载文件</button>
                        </div>
                        <div style="color: #666; font-size: 0.9rem;">文件大小: ${formatFileSize(data.fileSize)}</div>
                    `, 'success');

                    // 刷新文件列表
                    loadFiles(); // 改为 loadFiles
                    updateFileCount(); // 改为 updateFileCount

                    // 清空文件输入
                    fileInput.value = '';
                } else {
                    throw new Error(data.message || '上传失败');
                }
            } catch (error) {
                console.error('Upload error:', error);
                showResult(`上传失败: ${error.message}`, 'error');
            } finally {
                setTimeout(() => {
                    progress.style.display = 'none';
                }, 1000);
            }
        }

        // 显示结果
        function showResult(content, type) {
            result.className = `result ${type}`;
            resultContent.innerHTML = content;
            result.style.display = 'block';
        }

        // 复制到剪贴板
        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                alert('已复制到剪贴板！');
            } catch (err) {
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('已复制到剪贴板！');
            }
        }

        // 保存文件到本地存储
        function saveFileToStorage(fileData) { // 改为 saveFileToStorage
            const files = getStoredFiles(); // 改为 getStoredFiles
            files.unshift(fileData); // 添加到开头
            localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
        }

        // 获取存储的文件
        function getStoredFiles() { // 改为 getStoredFiles
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        }

        // 加载文件列表
        function loadFiles() { // 改为 loadFiles
            const files = getStoredFiles(); // 改为 getStoredFiles
            fileGrid.innerHTML = '';

            if (files.length === 0) {
                fileGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #999; padding: 40px;">暂无上传的文件</div>';
                return;
            }

            files.forEach((file, index) => { // 改为 file
                const card = document.createElement('div');
                card.className = 'file-card';
                const isImage = file.fileType && file.fileType.startsWith('image/'); // 判断是否为图片
                const previewContent = isImage ?
                    `<img src="${file.web2url}" alt="${file.fileName}" class="file-preview" loading="lazy">` :
                    `<div class="file-preview">${getFileIcon(file.fileType)}</div>`; // 使用函数获取图标
                card.innerHTML = `
                    ${previewContent}
                    <div class="file-info">
                        <div class="file-name" title="${file.fileName}">${file.fileName}</div>
                        <div class="file-meta">
                            <span class="file-size">${formatFileSize(file.fileSize)}</span>
                            <span class="file-type">${file.fileType || '未知类型'}</span>
                        </div>
                        <div class="file-cid" title="${file.cid}">CID: ${file.cid}</div>
                        <div class="file-upload-time">${formatDate(file.uploadTime)}</div>
                        <div class="file-actions">
                            <button class="btn btn-small btn-success" onclick="copyToClipboard('${file.web2url}')">复制链接</button>
                            <button class="btn btn-secondary btn-small" onclick="window.open('${file.web2url}', '_blank')">下载</button>
                            <button class="btn btn-danger btn-small" onclick="deleteFile(${index})">删除</button>
                        </div>
                    </div>
                `;
                fileGrid.appendChild(card);
            });
        }

        // 获取文件图标
        function getFileIcon(fileType) {
            if (!fileType) return '📄';
            if (fileType.startsWith('image/')) return '🖼️';
            if (fileType.startsWith('video/')) return '🎬';
            if (fileType.startsWith('audio/')) return '🎵';
            if (fileType === 'application/pdf') return '📄';
            if (fileType.includes('zip') || fileType.includes('rar') || fileType.includes('7z')) return '📦';
            if (fileType.includes('text') || fileType.includes('json') || fileType.includes('xml')) return '📝';
            if (fileType.includes('msword') || fileType.includes('vnd.openxmlformats-officedocument.wordprocessingml.document')) return '📄';
            if (fileType.includes('vnd.ms-excel') || fileType.includes('vnd.openxmlformats-officedocument.spreadsheetml.sheet')) return '📊';
            if (fileType.includes('vnd.ms-powerpoint') || fileType.includes('vnd.openxmlformats-officedocument.presentationml.presentation')) return '📽️';
            if (fileType.includes('application')) return '⚙️';
            return '📄';
        }


        // 删除文件
        function deleteFile(index) { // 改为 deleteFile
            if (confirm('确定要删除这个文件的记录吗？')) {
                const files = getStoredFiles(); // 改为 getStoredFiles
                files.splice(index, 1);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
                loadFiles(); // 改为 loadFiles
                updateFileCount(); // 改为 updateFileCount
            }
        }

        // 更新文件数量
        function updateFileCount() { // 改为 updateFileCount
            const files = getStoredFiles(); // 改为 getStoredFiles
            fileCount.textContent = files.length;
        }

        // 导出数据
        function exportData() {
            const files = getStoredFiles(); // 改为 getStoredFiles
            if (files.length === 0) {
                alert('没有数据可以导出');
                return;
            }

            const dataStr = JSON.stringify(files, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);

            const link = document.createElement('a');
            link.href = url;
            link.download = `xlog-files-${new Date().toISOString().split('T')[0]}.json`; // 改为 files
            link.click();

            URL.revokeObjectURL(url);
        }

        // 导入数据
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);

                    if (!Array.isArray(importedData)) {
                        throw new Error('无效的数据格式');
                    }

                    // 验证数据结构，兼容旧的图片数据结构
                    const validData = importedData.filter(item =>
                        item.cid && item.web2url && item.fileName // 基本要求
                        // 可以添加更严格的验证，例如检查是否有 fileSize 或 uploadTime
                        // && item.hasOwnProperty('fileSize') && item.hasOwnProperty('uploadTime')
                    );

                    if (validData.length === 0) {
                        throw new Error('没有找到有效的文件数据');
                    }

                    // 合并数据（避免重复）
                    const existingFiles = getStoredFiles(); // 改为 getStoredFiles
                    const existingCids = new Set(existingFiles.map(f => f.cid)); // 改为 f

                    const newFiles = validData.filter(f => !existingCids.has(f.cid)); // 改为 f
                    const mergedFiles = [...existingFiles, ...newFiles]; // 改为 Files

                    localStorage.setItem(STORAGE_KEY, JSON.stringify(mergedFiles)); // 改为 STORAGE_KEY

                    loadFiles(); // 改为 loadFiles
                    updateFileCount(); // 改为 updateFileCount

                    alert(`导入成功！新增 ${newFiles.length} 个文件记录`);
                } catch (error) {
                    alert(`导入失败: ${error.message}`);
                }
            };

            reader.readAsText(file);
            event.target.value = ''; // 清空文件输入
        }

        // 清空所有数据
        function clearAllData() {
            if (confirm('确定要清空所有数据吗？此操作不可恢复！')) {
                localStorage.removeItem(STORAGE_KEY);
                loadFiles(); // 改为 loadFiles
                updateFileCount(); // 改为 updateFileCount
                alert('数据已清空');
            }
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
        }
    </script>
</body>
</html>
